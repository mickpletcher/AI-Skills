name: Candidate helper runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  helpers:
    name: helpers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt Pillow==12.3.0 astropy==8.0.2
      - name: Check helpers with disposable inputs and mocked integrations
        run: python evaluations/fixtures/check_remaining_helpers.py
      - name: Check actual preview footer geometry
        run: python evaluations/fixtures/check_preview_footer.py
