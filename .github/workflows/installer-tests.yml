name: Installer regression tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'claude/scripts/Initialize-ClaudeSkills.ps1'
      - 'claude/scripts/tests/Initialize-ClaudeSkills.Tests.ps1'
      - '.github/workflows/installer-tests.yml'
permissions:
  contents: read
jobs:
  installer:
    name: Installer (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test limits and recovery with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./claude/scripts/tests/Initialize-ClaudeSkills.Tests.ps1
      - name: Test limits and recovery with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./claude/scripts/tests/Initialize-ClaudeSkills.Tests.ps1
