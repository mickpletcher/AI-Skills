name: Master skill generation validation
on:
  pull_request:
    paths:
      - 'master-skills/**'
      - 'adapters/**'
      - 'generated/**'
      - 'tools/tests/test_master_skills.py'
      - 'tools/tests/test_migration.py'
      - '.gitattributes'
      - 'tools/generate_master_skills.py'
      - 'tools/skill_repository.py'
      - 'schemas/skill-frontmatter.schema.json'
      - 'requirements-dev.txt'
      - '.github/workflows/master-skills-validation.yml'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile generator
        run: python -m py_compile tools/generate_master_skills.py
      - name: Verify generated candidates
        run: python tools/generate_master_skills.py --check
