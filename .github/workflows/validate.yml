name: Repository validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validator and evaluation regression tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate repository and generated catalog
        run: python tools/skill_repository.py validate
      - name: Exact-case Claude folders
        shell: pwsh
        run: ./claude/scripts/Validate-SkillFolders.ps1 -Root ./claude/skills -FailOnIssues
      - name: Quality validator entry point
        shell: pwsh
        run: ./claude/scripts/Validate-SkillQuality.ps1 -FailOnIssues
      - name: Installer regression tests in temporary libraries
        shell: pwsh
        run: ./claude/scripts/tests/Initialize-ClaudeSkills.Tests.ps1
      - name: Offline behavioral contract fixtures (not model evaluations)
        run: python tools/evaluate.py self-test
